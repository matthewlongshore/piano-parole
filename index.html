<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catherine's Piano Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@500;700;800&family=Playfair+Display:ital,wght@1,800&display=swap">
<style>
/* Home page: same look as the games. A playable piano on top, one big card per game. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#1A1720; --muted:#69647A; --line:#E2DFEA;
  --jr:#F08A3E; --int:#3E9CC4; --sr:#8B5BC9; --on-lvl:#17141C;
  --key-w:#FFFFFF; --key-b:#1A1720; --key-edge:#CFCBD9;
  --display:'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, sans-serif;
  --score:'Playfair Display', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131118; --surface:#1E1B25; --ink:#F1EEF6; --muted:#A39DB0; --line:#302B3A;
  --jr:#F59A55; --int:#5BB4DA; --sr:#A97FE3;
  --key-w:#ECE8F2; --key-b:#08070B; --key-edge:#3A3545; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131118; --surface:#1E1B25; --ink:#F1EEF6; --muted:#A39DB0; --line:#302B3A;
  --jr:#F59A55; --int:#5BB4DA; --sr:#A97FE3;
  --key-w:#ECE8F2; --key-b:#08070B; --key-edge:#3A3545; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}

.kb{position:relative;height:96px;display:flex;border-radius:4px 4px 12px 12px;overflow:hidden;
  border:2px solid var(--key-b);border-top-width:10px;background:var(--key-b);touch-action:manipulation;user-select:none;cursor:pointer}
.kb .w{flex:1;background:var(--key-w);border-right:1px solid var(--key-edge);border-radius:0 0 6px 6px;transition:background .15s}
.kb .w:last-child{border-right:0}
.kb .b{position:absolute;top:0;width:4.2%;height:58%;background:var(--key-b);border-radius:0 0 4px 4px;transform:translateX(-50%);transition:background .15s;z-index:2}
.kb .lit{background:var(--c,var(--jr))!important}

.brand h1{font-size:clamp(2.3rem,9vw,3.4rem);font-weight:800;letter-spacing:-.02em}
.brand h1 em{font-family:var(--score);font-style:italic;color:var(--jr);font-weight:800}
.brand p{margin:6px 0 0;color:var(--muted);font-weight:600;font-size:1.05rem}

.games{display:flex;flex-direction:column;gap:14px}
.game{--c:var(--jr);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;padding:20px 18px;border-radius:22px;
  background:var(--surface);border:2px solid var(--line);color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
.game:hover{border-color:var(--c);transform:translateY(-2px)}
.game:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.game .glyph{grid-row:1/3;width:76px;height:76px;border-radius:50%;background:var(--c);color:var(--on-lvl);display:grid;place-items:center;
  font-family:var(--score);font-style:italic;font-weight:800;font-size:1.7rem}
.game h2{font-size:1.45rem;align-self:end}
.game p{margin:0;color:var(--muted);font-weight:600;align-self:start}
.game.int{--c:var(--int)} .game.sr{--c:var(--sr)}
.hint{margin:0;text-align:center;color:var(--muted);font-weight:600;font-size:.9rem}
@media (max-width:520px){
  body{padding-block:12px 32px} .app{gap:20px} .kb{height:64px;border-top-width:7px}
  .game{padding:16px 14px;gap:2px 14px} .game .glyph{width:60px;height:60px;font-size:1.35rem} .game h2{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="kb" id="kb" aria-label="Piano keyboard, tap to play"></div>
  <div class="brand"><h1>Catherine's <em>Piano Games</em></h1><p>Pick a game. Or just play the piano up top.</p></div>
  <nav class="games">
    <a class="game" href="parole.html"><span class="glyph">mf</span><h2>Piano Parole</h2><p>Learn the Italian words in your music.</p></a>
    <a class="game int" href="intervals.html"><span class="glyph">8va</span><h2>Piano Intervalli</h2><p>Hear two notes and name the gap between them.</p></a>
  </nav>
</div>

<script>
// a real piano for the keyboard (Salamander Grand Piano recordings, shared with the interval game)
const WHITES=[48,50,52,53,55,57,59,60,62,64,65,67,69,71,72];
const BLACKS=[[49,1],[51,2],[54,4],[56,5],[58,6],[61,8],[63,9],[66,11],[68,12],[70,13]];
const SAMPLES={45:"A2",48:"C3",51:"Ds3",54:"Fs3",57:"A3",60:"C4",63:"Ds4",66:"Fs4",69:"A4",72:"C5"};
const kb=document.getElementById("kb"),buffers={};let ctx,master,loading=null;
kb.innerHTML=WHITES.map(n=>`<div class="w" data-n="${n}"></div>`).join("")+
  BLACKS.map(([n,i])=>`<div class="b" data-n="${n}" style="left:${i/WHITES.length*100}%"></div>`).join("");
function audio(){
  if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination)}
  if(ctx.state!=="running")ctx.resume();return ctx}
function load(){
  if(loading)return loading;audio();
  const decode=ab=>new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)});
  return loading=Promise.all(Object.entries(SAMPLES).map(([n,f])=>fetch(`piano/${f}.mp3`).then(r=>r.arrayBuffer()).then(decode).then(b=>{buffers[n]=b}).catch(()=>{})));
}
// phones only allow sound that starts during a tap
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  try{audio();const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0)}catch(e){}
  load();
}
["touchend","pointerup","click","keydown"].forEach(t=>addEventListener(t,unlock,{capture:true,passive:true}));
function play(n,when=0){
  const k=kb.querySelector(`[data-n="${n}"]`);
  setTimeout(()=>{if(k){k.classList.add("lit");setTimeout(()=>k.classList.remove("lit"),300)}},when*1000);
  try{
    audio();const src=Object.keys(SAMPLES).map(Number).reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
    if(!buffers[src])return;
    const t0=ctx.currentTime+when+.02,s=ctx.createBufferSource(),g=ctx.createGain();
    s.buffer=buffers[src];s.playbackRate.value=2**((n-src)/12);s.connect(g).connect(master);
    g.gain.setValueAtTime(.8,t0);g.gain.setTargetAtTime(0,t0+1.4,.15);s.start(t0);s.stop(t0+2.5);
  }catch(e){}
}
kb.addEventListener("pointerdown",e=>{const n=e.target.closest("[data-n]")?.dataset.n;if(n)load().then(()=>play(+n))});
// hovering a game card plays a little hello on a computer
document.querySelectorAll(".game").forEach((g,i)=>g.addEventListener("pointerenter",e=>{
  if(e.pointerType!=="mouse"||!ctx||ctx.state!=="running")return;
  [[60,64,67],[60,67,72]][i].forEach((n,j)=>play(n,j*.07));
}));
load();
</script>

</html>
