<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@500;700;800&family=Playfair+Display:ital,wght@1,800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&text=%F0%9D%84%9E%F0%9D%84%A2%E2%99%AF%E2%99%AD&display=block">
<style>
/* Same look as the other games. A note shows on the staff; tap its key on the piano. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#1A1720; --muted:#69647A; --line:#E2DFEA;
  --jr:#F08A3E; --int:#3E9CC4; --sr:#8B5BC9; --on-lvl:#17141C;
  --good:#23945A; --bad:#D43F57;
  --key-w:#FFFFFF; --key-b:#1A1720; --key-edge:#CFCBD9;
  --display:'Bricolage Grotesque', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, sans-serif;
  --score:'Playfair Display', Georgia, 'Times New Roman', serif;
  --lvl:var(--jr);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131118; --surface:#1E1B25; --ink:#F1EEF6; --muted:#A39DB0; --line:#302B3A;
  --jr:#F59A55; --int:#5BB4DA; --sr:#A97FE3; --good:#45B97A; --bad:#EF6478;
  --key-w:#ECE8F2; --key-b:#08070B; --key-edge:#3A3545; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131118; --surface:#1E1B25; --ink:#F1EEF6; --muted:#A39DB0; --line:#302B3A;
  --jr:#F59A55; --int:#5BB4DA; --sr:#A97FE3; --good:#45B97A; --bad:#EF6478;
  --key-w:#ECE8F2; --key-b:#08070B; --key-edge:#3A3545; color-scheme:dark }
body.l1{--lvl:var(--jr)} body.l2{--lvl:var(--int)} body.l3{--lvl:var(--sr)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--lvl);outline-offset:3px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}

/* keyboard */
.kb{position:relative;height:96px;display:flex;border-radius:4px 4px 12px 12px;overflow:hidden;
  border:2px solid var(--key-b);border-top-width:10px;background:var(--key-b);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.kb .w{flex:1;background:var(--key-w);border-right:1px solid var(--key-edge);border-radius:0 0 6px 6px;transition:background .15s;position:relative}
.kb .w:last-child{border-right:0}
.kb .b{position:absolute;top:0;width:4.4%;height:58%;background:var(--key-b);border-radius:0 0 4px 4px;transform:translateX(-50%);transition:background .15s;z-index:2}
.kb .lit{background:var(--lvl)!important}
.kb .ok{background:var(--good)!important} .kb .no{background:var(--bad)!important}
.kb .mid::after{content:"";position:absolute;left:50%;bottom:10px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--key-edge)}
.kb .mid.mark::after{display:none}
.kb .tag{position:absolute;left:50%;bottom:6px;translate:-50% 0;font-family:var(--display);font-weight:800;font-size:.85rem;color:#fff;pointer-events:none}
.kb .b .tag{bottom:4px;font-size:.65rem}
.playing .kb{height:150px;cursor:pointer}
.qcard .btn{width:100%;max-width:360px;padding:10px 16px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(2.2rem,8vw,3.1rem);font-weight:800;letter-spacing:-.02em}
.brand h1 em{font-family:var(--score);font-style:italic;color:var(--lvl);font-weight:800}
.brand p{margin:4px 0 0;color:var(--muted);font-weight:600}
.top-btns{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{padding:8px 12px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:.85rem;color:var(--muted);background:var(--surface);text-decoration:none}
.label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}

.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{padding:12px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:center;transition:transform .12s}
.lv b{display:block;font-family:var(--display);font-size:1.1rem}
.lv span{font-size:.8rem;color:var(--muted);font-weight:700}
.lv[aria-pressed="true"]{background:var(--lvl);border-color:var(--lvl);color:var(--on-lvl)}
.lv[aria-pressed="true"] span{color:var(--on-lvl);opacity:.75}
.lv:active{transform:scale(.97)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;padding:18px 16px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);
  display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .12s,border-color .12s}
.mode:hover{border-color:var(--lvl);transform:translateY(-2px)}
.mode .glyph{font-family:var(--score);font-style:italic;font-size:2.1rem;line-height:1;color:var(--lvl)}
.mode h3{font-size:1.25rem}
.mode p{margin:0;color:var(--muted);font-size:.9rem;font-weight:600}
.mode .best{margin-top:auto;font-size:.8rem;font-weight:800;color:var(--ink)}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h2{font-size:1.3rem;flex:1;min-width:0}
.chip{padding:4px 10px;border-radius:999px;background:var(--lvl);color:var(--on-lvl);font-weight:800;font-size:.78rem}
.back{font-weight:800;padding:6px 12px 6px 6px;border-radius:999px;color:var(--muted)}
.back:hover{color:var(--ink)}
.stats{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95rem}
.stats strong{color:var(--ink)}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--lvl)}
.timer{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--lvl);transform-origin:left}

/* the staff */
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.staff{width:100%;max-width:360px;height:auto;display:block;color:var(--ink)}
.staff .ln{stroke:currentColor;stroke-width:1.4}
.staff .clef{font-family:'Noto Music','Apple Symbols','Segoe UI Symbol',serif;fill:currentColor}
.staff .head{fill:var(--ink);transition:fill .15s}
.staff.ok .head{fill:var(--good)} .staff.no .head{fill:var(--bad)}
.staff .name{font-family:var(--display);font-weight:800;font-size:22px;fill:var(--good);paint-order:stroke;stroke:var(--surface);stroke-width:6px}
.reveal{min-height:1.6em;font-weight:700;color:var(--muted);font-size:.95rem;text-align:center}
.reveal b{color:var(--ink);font-family:var(--display);font-size:1.1rem}

.btn{padding:14px 16px;border-radius:14px;font-weight:800;font-size:1rem;border:2px solid var(--line);background:var(--surface);text-align:center}
.btn.go{background:var(--lvl);border-color:var(--lvl);color:var(--on-lvl)}
.btn:active{transform:scale(.98)}
.btn[hidden]{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{margin:0;text-align:center;color:var(--muted);font-weight:600;font-size:.9rem}

.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:30px 20px}
.done h2{font-family:var(--score);font-style:italic;font-size:clamp(2.4rem,10vw,3.4rem);color:var(--lvl)}
.done .num{font-family:var(--display);font-size:1.4rem;font-weight:800}
.stars{font-size:2.2rem;letter-spacing:.2em;color:var(--lvl)} .stars .off{color:var(--line)}
.done .row{width:100%}
.credit{margin:0;text-align:center;color:var(--muted);font-size:.8rem;font-weight:600}
.credit a{color:inherit}

@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (max-width:520px){
  .app{gap:16px} .kb{height:64px;border-top-width:7px}
  .playing .kb{height:150px;margin-inline:-16px;border-radius:0;border-left:0;border-right:0}
  body{padding-block:12px 32px}
  .mode{min-height:132px;padding:14px 12px}.mode h3{font-size:1.1rem}
  .kb .tag{font-size:.7rem;bottom:4px} .kb .b .tag{font-size:.5rem}
}
/* phone on its side: everything squeezed so staff and keyboard both fit */
@media (orientation:landscape) and (max-height:500px){
  body{padding-block:6px 12px} .app{max-width:none;gap:8px}
  .playing .dots{display:none} .bar h2{font-size:1.1rem}
  .qcard{flex-direction:row;justify-content:center;gap:12px;padding:4px 12px}
  .staff{max-width:240px} .qcard .reveal{min-width:130px} .qcard .btn{max-width:140px}
  .playing .kb{height:130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="fx"></canvas>
<div id="stage"></div>

<script>
// ---------- helpers
const $=s=>document.querySelector(s);
const pick=a=>a[Math.random()*a.length|0];
const store={get(k,d){try{const v=localStorage.getItem("pn:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("pn:"+k,JSON.stringify(v))}catch(e){}}};
let lvl=store.get("lvl",1),muted=store.get("mute",false),timers=[],raf=0;
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf)};

// ---------- the notes. A note is written on a staff step (s) with an accidental (a: -1 flat, 0, 1 sharp); n is its piano key.
// Steps count white keys: C4 is 28, D4 is 29 ... The bottom line of each staff: E4 for treble, G2 for bass.
const LETTERS="CDEFGAB",NAT=[0,2,4,5,7,9,11],BASE={treble:30,bass:18};
// levels only change how many notes are used. r: lowest and highest step per clef, counted from the bottom line
// (8 is the top line; every 2 steps past the staff is one more ledger line)
// Each clef keeps to one octave around middle C, so the on-screen piano stays short and the keys big:
// treble is middle C up to C, bass is C up to middle C; higher levels add ledger-line notes on the middle C side.
const LEVELS={
  1:{name:"Junior",r:{treble:[-2,5],bass:[3,10]},acc:false},   // C to C
  2:{name:"Intermediate",r:{treble:[-4,5],bass:[3,12]},acc:true}, // + sharps and flats, 2 ledger lines
  3:{name:"Senior",r:{treble:[-6,5],bass:[3,14]},acc:true}};      // 3 ledger lines
const STAVES={treble:"Treble",bass:"Bass",both:"Both"};
let staff=store.get("staff","treble");
const clefsOf=()=>staff==="both"?["treble","bass"]:[staff];
const keyOf=(s,a=0)=>(Math.floor(s/7)+1)*12+NAT[s%7]+a;
const isWhite=n=>NAT.includes(n%12);
const nameOf=q=>LETTERS[q.s%7]+(q.a<0?"♭":q.a>0?"♯":"");
const ODD=["C♭","F♭","E♯","B♯"]; // correct but confusing spellings are left out
function pool(l){
  const L=LEVELS[l],out=[];
  for(const clef of clefsOf())for(let o=L.r[clef][0];o<=L.r[clef][1];o++)for(const a of L.acc?[-1,0,1]:[0]){
    const s=BASE[clef]+o,q={clef,s,a,n:keyOf(s,a)};if(!ODD.includes(nameOf(q)))out.push(q)}
  return out;
}
// about half the notes are plain white keys, the rest sharps and flats
function nextNote(last){
  const all=pool(lvl),plain=all.filter(q=>!q.a),sf=all.filter(q=>q.a);let q;
  do{q=pick(sf.length&&Math.random()<.5?sf:plain)}while(last&&q.n===last.n&&q.clef===last.clef);return q;
}

// ---------- piano sound (Salamander Grand Piano recordings, shared with the other games)
const SAMPLES={45:"A2",48:"C3",51:"Ds3",54:"Fs3",57:"A3",60:"C4",63:"Ds4",66:"Fs4",69:"A4",72:"C5"};
const buffers={};let ctx,master,loading=null;
function audio(){
  if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.9;
    const lim=ctx.createDynamicsCompressor();lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.15;
    master.connect(lim);lim.connect(ctx.destination)}
  if(ctx.state!=="running")ctx.resume();return ctx}
function loadPiano(){
  if(loading)return loading;audio();
  const decode=ab=>new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)});
  return loading=Promise.all(Object.entries(SAMPLES).map(([n,f])=>
    fetch(`piano/${f}.mp3`).then(r=>r.arrayBuffer()).then(decode).then(b=>{buffers[n]=b}).catch(()=>{})));
}
// phones only allow sound that starts during a tap
function unlock(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  try{audio();const b=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0)}catch(e){}
  loadPiano();
}
["touchend","pointerup","click","keydown"].forEach(t=>addEventListener(t,unlock,{capture:true,passive:true}));
function note(n,when=0,dur=1.4,vol=.8){
  if(muted)return;
  try{
    audio();
    const t0=ctx.currentTime+when+.02,g=ctx.createGain();g.connect(master);
    const src=Object.keys(SAMPLES).map(Number).reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
    if(buffers[src]){
      const s=ctx.createBufferSource();s.buffer=buffers[src];s.playbackRate.value=2**((n-src)/12);s.connect(g);
      g.gain.setValueAtTime(vol,t0);g.gain.setValueAtTime(vol,t0+dur);g.gain.setTargetAtTime(0,t0+dur,.12);s.start(t0);s.stop(t0+dur+1);
    }else{
      const o=ctx.createOscillator();o.type="triangle";o.frequency.value=440*2**((n-69)/12);o.connect(g);
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol*.3,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);o.start(t0);o.stop(t0+dur);
    }
  }catch(e){}
}
const fanfare=()=>[48,52,55,60,64,67,72].forEach((n,i)=>note(n,i*.09,1.6,.5));

// ---------- keyboard. It sits on top on the home screen and moves under the staff while playing, so thumbs can reach it.
const kb=document.createElement("div");kb.className="kb";kb.setAttribute("aria-label","Piano keyboard");
// the keyboard covers just the notes in play for these clefs (one clef while answering), so the keys stay big
function buildKb(clefs=clefsOf()){
  const ns=pool(lvl).filter(q=>clefs.includes(q.clef)).map(q=>q.n);let lo=Math.min(...ns),hi=Math.max(...ns);
  while(!isWhite(lo))lo--;while(!isWhite(hi))hi++;
  const whites=[];for(let n=lo;n<=hi;n++)if(isWhite(n))whites.push(n);
  const bw=60/whites.length;
  kb.innerHTML=whites.map(n=>`<div class="w${n===60?" mid":""}" data-n="${n}"></div>`).join("")+
    whites.slice(0,-1).filter(n=>!isWhite(n+1)).map(n=>`<div class="b" data-n="${n+1}" style="width:${bw}%;left:${(whites.indexOf(n)+1)/whites.length*100}%"></div>`).join("");
}
const key=n=>kb.querySelector(`[data-n="${n}"]`);
let onKey=null; // set while a question waits for an answer
kb.addEventListener("pointerdown",e=>{
  const n=+e.target.closest("[data-n]")?.dataset.n;if(!n)return;e.preventDefault();
  if(onKey)return onKey(n);
  note(n);const k=key(n);k.classList.add("lit");setTimeout(()=>k.classList.remove("lit"),300);
});
function markKey(n,cls,name){const k=key(n);if(!k)return;k.classList.add("mark",cls);if(name)k.insertAdjacentHTML("beforeend",`<span class="tag">${name}</span>`)}
function clearMarks(){kb.querySelectorAll(".mark").forEach(k=>{k.classList.remove("mark","ok","no","lit");k.querySelector(".tag")?.remove()})}
const placeKb=()=>{const s=$("#kbslot");if(s)s.replaceWith(kb)};

// ---------- the staff, drawn as a picture. Lines 12 units apart; each white key is half a gap.
const GAP=12,TOP=44,BOTTOM=TOP+4*GAP;
function staffSVG(q,name){
  const off=q.s-BASE[q.clef],y=BOTTOM-off*GAP/2,x=190;
  let led="";
  for(let o=-2;o>=off;o-=2)led+=`<line class="ln" x1="${x-17}" x2="${x+17}" y1="${BOTTOM-o*GAP/2}" y2="${BOTTOM-o*GAP/2}"/>`;
  for(let o=10;o<=off;o+=2)led+=`<line class="ln" x1="${x-17}" x2="${x+17}" y1="${BOTTOM-o*GAP/2}" y2="${BOTTOM-o*GAP/2}"/>`;
  const clef=q.clef==="treble"?`<text class="clef" x="12" y="${BOTTOM-1.2}" font-size="51">𝄞</text>`
                              :`<text class="clef" x="14" y="${TOP+43}" font-size="50">𝄢</text>`;
  return `<svg class="staff" id="staff" viewBox="0 ${q.clef==="treble"?16:-12} 300 130" role="img" aria-label="A note on the ${q.clef} clef${q.a?(q.a<0?", flat":", sharp"):""}">
    ${[0,1,2,3,4].map(i=>`<line class="ln" x1="6" x2="294" y1="${TOP+i*GAP}" y2="${TOP+i*GAP}"/>`).join("")}
    <line class="ln" x1="6" x2="6" y1="${TOP}" y2="${BOTTOM}"/><line class="ln" x1="294" x2="294" y1="${TOP}" y2="${BOTTOM}"/>
    ${clef}${led}
    <g transform="translate(${x} ${y}) rotate(-20)"><ellipse class="head" rx="9.4" ry="6.4"/><ellipse rx="5" ry="2.8" fill="var(--surface)" transform="rotate(-25)"/></g>
    ${q.a?`<text class="clef" x="${x-29}" y="${y+(q.a<0?4:6)}" font-size="45">${q.a<0?"♭":"♯"}</text>`:""}
    <text class="name" id="nname" x="${x+24}" y="${y+8}">${name||""}</text></svg>`;
}

// ---------- confetti
const fx=$("#fx"),fc=fx.getContext("2d");let bits=[];
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  fx.width=innerWidth;fx.height=innerHeight;
  const cs=getComputedStyle(document.body),cols=["--jr","--int","--sr","--good"].map(v=>cs.getPropertyValue(v).trim());
  bits=Array.from({length:90},()=>({x:Math.random()*fx.width,y:-20-Math.random()*fx.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
    c:cols[Math.random()*4|0],note:Math.random()<.3,a:Math.random()*6}));
  const stepf=()=>{fc.clearRect(0,0,fx.width,fx.height);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.a+=.1;fc.fillStyle=b.c;
      if(b.note){fc.font="bold 22px Georgia";fc.fillText("♪",b.x,b.y)}else{fc.save();fc.translate(b.x,b.y);fc.rotate(b.a);fc.fillRect(-5,-3,10,6);fc.restore()}});
    bits=bits.filter(b=>b.y<fx.height+30);if(bits.length)requestAnimationFrame(stepf);else fc.clearRect(0,0,fx.width,fx.height)};
  stepf();
}

// ---------- screens
const stage=$("#stage");
const setLevel=l=>{lvl=l;store.set("lvl",l);document.body.className="l"+l;buildKb()};
const bestKey=m=>`best:${lvl}:${staff}:${m}`,best=m=>store.get(bestKey(m),null);
const secs=ms=>(ms/1000).toFixed(1)+"s";
function bar(title){return `<div class="bar"><button class="back" id="back">← Back</button><h2>${title}</h2><span class="chip">${LEVELS[lvl].name} · ${STAVES[staff]}</span></div>`}
const wireBack=()=>{$("#back").onclick=home};
function reset(){clearTimers();clearMarks();onKey=null;stage.classList.remove("playing")}

function home(){
  reset();buildKb();
  const bq=best("ten"),bc=best("clock");
  stage.innerHTML=`<div class="app"><div id="kbslot"></div>
   <div class="top"><div class="brand"><h1>Piano <em>Note</em></h1><p>A note shows up. Find it on the piano, fast!</p></div>
     <div class="top-btns"><a class="icon-btn" href="./">← All games</a>
     <button class="icon-btn" id="mute" aria-pressed="${muted}">${muted?"Sound off":"Sound on"}</button></div></div>
   <div class="group"><span class="label">Pick your level</span>
    <div class="levels">${[1,2,3].map(l=>`<button class="lv" data-l="${l}" aria-pressed="${l===lvl}"><b>${LEVELS[l].name}</b><span>${new Set(pool(l).map(q=>q.clef+q.s+q.a)).size} notes</span></button>`).join("")}</div></div>
   <div class="group"><span class="label">Which staff</span>
    <div class="levels">${Object.entries(STAVES).map(([k,v])=>`<button class="lv" data-st="${k}" aria-pressed="${k===staff}"><b>${v}</b></button>`).join("")}</div></div>
   <div class="group"><span class="label">Pick a game</span>
   <div class="modes">
    <button class="mode" data-m="ten"><span class="glyph">mf</span><h3>Ten Notes</h3><p>Find 10 notes. Get them all right, then get faster.</p><span class="best">${bq?`Best: ${bq.score}/10 in ${secs(bq.ms)}`:"Not played yet"}</span></button>
    <button class="mode" data-m="clock"><span class="glyph">ff</span><h3>Beat the Clock</h3><p>How many notes can you find in 60 seconds?</p><span class="best">${bc!=null?`Best: ${bc}`:"Not played yet"}</span></button>
   </div></div>
   <p class="hint">Tip: the dot on the keyboard is middle C.</p>
   <p class="credit">Piano: <a href="https://archive.org/details/SalamanderGrandPianoV3" target="_blank" rel="noopener">Salamander Grand Piano</a> by Alexander Holm (CC BY 3.0)</p>
  </div>`;
  placeKb();
  stage.querySelectorAll("[data-l]").forEach(el=>el.onclick=()=>{setLevel(+el.dataset.l);home()});
  stage.querySelectorAll("[data-st]").forEach(el=>el.onclick=()=>{staff=el.dataset.st;store.set("staff",staff);buildKb();home()});
  stage.querySelectorAll(".mode").forEach(el=>el.onclick=()=>({ten,clock})[el.dataset.m]());
  $("#mute").onclick=()=>{muted=!muted;store.set("mute",muted);home()};
}

// one question: draw the note, wait for a key. No sound until the answer, so it can't be found by ear.
// onAnswer(ok, ms) is called once.
function ask(q,onAnswer){
  buildKb([q.clef]);
  $("#card").innerHTML=staffSVG(q)+`<div class="reveal" id="reveal">Tap the key for this note</div><button class="btn go" id="next" hidden>Next →</button>`;
  const t0=performance.now();
  onKey=n=>{
    onKey=null;const ms=performance.now()-t0,ok=n===q.n,name=nameOf(q);
    $("#staff").classList.add(ok?"ok":"no");$("#nname").textContent=name;
    if(ok){markKey(n,"ok",name);note(n);$("#reveal").innerHTML=`<b>${name}</b> · ${secs(ms)}`}
    else{
      markKey(n,"no");markKey(q.n,"ok",name);note(n,0,.5,.6);note(q.n,.45);
      $("#card").classList.add("shake");later(()=>$("#card")?.classList.remove("shake"),400);
      $("#reveal").innerHTML=`It was <b>${name}</b>${(n-q.n)%12===0?" — right note, wrong octave!":""}`;
    }
    onAnswer(ok,ms);
  };
}
function playScreen(title,top){
  stage.innerHTML=`<div class="app">${bar(title)}${top}<div class="qcard" id="card"></div><div id="kbslot"></div></div>`;
  stage.classList.add("playing");placeKb();wireBack();
}
const ready=fn=>{$("#card").innerHTML=`<div class="reveal">Loading the piano…</div>`;loadPiano().then(()=>{if($("#card"))fn()})};

// --- ten notes
function ten(){
  reset();
  let i=0,score=0,total=0,res=[],last=null;
  playScreen("Ten Notes",`<div class="dots" id="dots"></div><div class="stats"><span>Note <strong id="num">1</strong> of 10</span><span>Time <strong id="time">0.0s</strong></span></div>`);
  const draw=()=>{
    if(i===10)return over();
    $("#dots").innerHTML=Array.from({length:10},(_,k)=>`<i class="${res[k]===true?"ok":res[k]===false?"no":k===i?"now":""}"></i>`).join("");
    $("#num").textContent=i+1;
    last=nextNote(last);
    ask(last,(ok,ms)=>{res[i]=ok;total+=ms;if(ok)score++;$("#time").textContent=secs(total);
      $("#dots").children[i].className=ok?"ok":"no";
      // right answers move on by themselves; after a wrong one you choose when to go on
      if(ok)later(()=>{i++;draw()},700);else{const b=$("#next");b.hidden=false;b.onclick=()=>{i++;draw()}}});
  };
  const over=()=>{
    const prev=best("ten"),rec=!prev||score>prev.score||(score===prev.score&&total<prev.ms);
    if(rec)store.set(bestKey("ten"),{score,ms:total});
    const stars=score===10?3:score>=8?2:score>=6?1:0;
    finish({title:stars===3?"Bravissimo!":stars>=1?"Bravo!":"Ancora!",stars,line:`${score} out of 10 in ${secs(total)}`,
      sub:rec?"New best!":`Your best: ${prev.score}/10 in ${secs(prev.ms)}`,again:ten,party:stars>=2});
  };
  ready(draw);
}

// --- beat the clock
function clock(){
  reset();
  const LEN=60;let score=0,start=0,last=null,done=false;
  playScreen("Beat the Clock",`<div class="stats"><span>Score <strong id="score">0</strong></span><span><strong id="secs">${LEN}</strong>s</span></div><div class="timer"><i id="tb"></i></div>`);
  const next=()=>{if(done)return;last=nextNote(last);
    ask(last,ok=>{if(done)return;if(ok)score++;$("#score").textContent=score;later(next,ok?350:1500)})};
  const tick=()=>{
    const left=Math.max(0,LEN-(performance.now()-start)/1000);
    $("#tb").style.transform=`scaleX(${left/LEN})`;$("#secs").textContent=Math.ceil(left);
    if(left<=0){done=true;onKey=null;const prev=best("clock"),rec=prev==null||score>prev;if(rec)store.set(bestKey("clock"),score);
      return finish({title:score>=30?"Bravissimo!":score>=15?"Bravo!":"Ancora!",line:`${score} notes in 60 seconds`,
        sub:rec&&score>0?"New best score!":prev!=null?`Your best: ${prev}`:"",again:clock,party:rec&&score>0})}
    raf=requestAnimationFrame(tick)};
  ready(()=>{start=performance.now();next();raf=requestAnimationFrame(tick)});
}

function finish({title,line,sub="",stars,again,party}){
  reset();
  stage.innerHTML=`<div class="app">${bar("Finished")}<div class="done">
    <h2>${title}</h2>
    ${stars!=null?`<div class="stars" aria-label="${stars} of 3 stars">${[0,1,2].map(k=>`<span class="${k<stars?"":"off"}">★</span>`).join("")}</div>`:""}
    <div class="num">${line}</div>${sub?`<div style="color:var(--muted);font-weight:700">${sub}</div>`:""}
    <div class="row"><button class="btn" id="home">Back</button><button class="btn go" id="again">Play again</button></div></div></div>`;
  wireBack();$("#home").onclick=home;$("#again").onclick=again;
  if(party){fanfare();confetti()}
}

setLevel(lvl);loadPiano();home();
</script>
